<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Shift Checklist</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:18px 20px;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:22px}header p{margin:5px 0 0;color:#cbd5e1;font-size:13px}
main{max-width:1000px;margin:auto;padding:18px}.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:11px 14px;font-weight:600;cursor:pointer}
.tab{background:#e5e7eb}.tab.active{background:#111827;color:white}
.card{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 5px #0001}
.progress{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:#16a34a;width:0}
.item{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}
.item input{width:21px;height:21px;margin-top:1px}.status-row{display:flex;gap:6px;flex-wrap:wrap}.status-btn{padding:7px 9px;border-radius:8px;background:#e5e7eb;color:#374151;font-size:11px}.status-btn.selected{color:white}.status-btn.pass.selected{background:#16a34a}.status-btn.fail.selected{background:#dc2626}.status-btn.na.selected{background:#6b7280}.text{flex:1}.done{text-decoration:line-through;color:#6b7280}
.badge{font-size:11px;padding:4px 7px;border-radius:999px;background:#fee2e2;color:#991b1b}.badge.optional{background:#e0f2fe;color:#075985}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.primary{background:#2563eb;color:white}.danger{background:#dc2626;color:white}.secondary{background:#e5e7eb}
textarea,input[type=text],select{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;font:inherit}
.small{font-size:12px;color:#6b7280}.hidden{display:none}.comment{margin-top:8px;font-size:13px;resize:vertical;background:#fafafa}.photo-row{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}.photo-btn{display:inline-block;background:#e5e7eb;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}.preview{display:block;margin-top:8px;max-width:180px;max-height:140px;border-radius:9px;border:1px solid #ddd;object-fit:cover}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:650px){main{padding:12px}.row{grid-template-columns:1fr}.tabs button{flex:1}.card{padding:13px}}
dialog{border:0;border-radius:16px;max-width:560px;width:92%;padding:0;box-shadow:0 20px 60px #0004}dialog::backdrop{background:#0007}
.modal{padding:20px}.modal h2{margin-top:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
</style>
</head>
<body>
<header><h1>Shift Checklist</h1><p id="dateLine" style="font-size:14px;font-weight:600;color:#e5e7eb"></p></header>
<main>
<div class="tabs" id="tabs"></div>
<div class="card">
  <div style="display:flex;justify-content:space-between;gap:10px"><b id="sectionTitle"></b><span class="small" id="count"></span></div>
  <div class="progress" style="margin-top:10px"><div class="bar" id="bar"></div></div>
</div>
<div class="card" id="list"></div>
<div class="card">
  <b>Shift notes / handover</b>
  <textarea id="notes" rows="5" placeholder="Record issues, actions, maintenance, quality, production delays..."></textarea>
  <div class="actions"><button class="primary" onclick="saveNotes()">Save Notes</button><button class="secondary" onclick="completeShift()">Complete Shift</button></div>
</div>
<div class="card">
  <b>Shift Summary / Handover</b>
  <p class="small">Automatically collects FAIL items, comments, photos and incomplete required checks from all sections.</p>
  <div class="actions"><button class="primary" onclick="showSummary()">Generate Summary</button><button class="secondary" onclick="copySummary()">Copy Summary</button></div>
  <div id="summary" class="hidden" style="margin-top:14px"></div>
</div>
<div class="card">
  <b>Checklist settings</b><p class="small">Add, edit, delete or reorder your own checks. Changes are saved on this device.</p>
  <div class="actions"><button class="primary" onclick="openManager()">Edit Checklist</button><button class="secondary" onclick="newShift()">Start New Shift</button><button class="danger" onclick="clearCurrent()">Clear Current Shift</button></div>
</div>
</main>

<dialog id="manager"><div class="modal"><h2>Edit Checklist</h2><div id="manageList"></div><div class="actions"><button class="primary" onclick="addItem()">+ Add item</button></div><div class="modal-actions"><button class="secondary" onclick="manager.close()">Done</button></div></div></dialog>

<script>
const defaults={
"START SHIFT":[
["Check previous shift handover",true],["Check production schedule",true],["Check staffing / attendance",true],
["Check raw materials and fillers",true],["Check machine condition",true],["Check safety / housekeeping",true],
["Check outstanding maintenance issues",true],["Check outstanding quality issues",true]],
"DURING SHIFT":[
["Monitor production target",true],["Complete quality checks",true],["Monitor raw material usage",false],
["Record downtime",true],["Record maintenance issues",true],["Communicate issues to team",false],
["Check production / machine condition",false]],
"END SHIFT":[
["Confirm production result",true],["Complete production records",true],["Record downtime",true],
["Record outstanding maintenance",true],["Record quality issues",true],["Check material status",false],
["Housekeeping / 5S",true],["Complete handover notes",true]]
};
let data=JSON.parse(localStorage.getItem("shiftChecklistData")||"null")||Object.fromEntries(Object.entries(defaults).map(([k,v])=>[k,v.map(x=>({text:x[0],mandatory:x[1]}))]));
let state=JSON.parse(localStorage.getItem("shiftState")||"null")||{};
let active=localStorage.getItem("activeSection")||"START SHIFT";
let notes=localStorage.getItem("shiftNotes")||"";
document.getElementById("notes").value=notes;
document.getElementById("dateLine").textContent=new Date().toLocaleString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"numeric",minute:"2-digit"});

function save(){localStorage.setItem("shiftChecklistData",JSON.stringify(data));localStorage.setItem("shiftState",JSON.stringify(state));localStorage.setItem("activeSection",active)}
function renderTabs(){tabs.innerHTML=Object.keys(data).map(k=>`<button class="tab ${k===active?'active':''}" onclick="active='${k}';save();render()">${k}</button>`).join("")}
function render(){
renderTabs(); sectionTitle.textContent=active; const arr=data[active]||[]; const done=arr.filter((_,i)=>state[active]?.[i]?.status).length;
count.textContent=`${done}/${arr.length} completed`; bar.style.width=(arr.length?done/arr.length*100:0)+"%";
list.innerHTML=arr.length?arr.map((x,i)=>`<div class="item">
<div style="padding-top:1px">
  <input type="checkbox" ${state[active]?.[i]?.statusOptionsOpen ? 'checked' : ''} onchange="toggleStatusOptions(${i},this.checked)" aria-label="Open status options">
</div>
<div class="text ${state[active]?.[i]?.status?'done':''}">
  <div class="status-row" style="${state[active]?.[i]?.statusOptionsOpen ? '' : 'display:none;'}">
    <button class="status-btn pass ${state[active]?.[i]?.status==='PASS'?'selected':''}" onclick="setStatus(${i},'PASS')">PASS</button>
    <button class="status-btn fail ${state[active]?.[i]?.status==='FAIL'?'selected':''}" onclick="setStatus(${i},'FAIL')">FAIL</button>
    <button class="status-btn na ${state[active]?.[i]?.status==='N/A'?'selected':''}" onclick="setStatus(${i},'N/A')">N/A</button>
  </div>
  ${esc(x.text)} ${x.mandatory?'<span class="badge">Required</span>':'<span class="badge optional">Optional</span>'}
${state[active]?.[i]?.status==='FAIL' ? `${state[active]?.[i]?.status==='FAIL' ? `
  <textarea class="comment" rows="2" placeholder="Comment required for FAIL..." onchange="setComment(${i},this.value)">${esc(state[active]?.[i]?.comment||"")}</textarea>
  <div class="photo-row">
    <label class="photo-btn">📷 Add photo
      <input type="file" accept="image/*" capture="environment" hidden onchange="addPhoto(${i},this.files[0])">
    </label>
    <span class="small">${state[active]?.[i]?.photoName ? esc(state[active][i].photoName) : "No photo attached"}</span>
  </div>
  ${state[active]?.[i]?.photo ? `<img class="preview" src="${state[active][i].photo}" alt="Checklist photo">` : ""}
` : ""}
` : ""}
</div></div>`).join(""):"<p class='small'>No checklist items. Add one in Edit Checklist.</p>";
}
function setStatus(i,v){
  state[active]=state[active]||{};
  state[active][i]=state[active][i]||{};
  const item=state[active][i];
  item.status=item.status===v ? "" : v;
  item.statusOptionsOpen=true;
  save();
  render();
}
function toggleStatusOptions(i,checked){
  state[active]=state[active]||{};
  state[active][i]=state[active][i]||{};
  const item=state[active][i];
  item.statusOptionsOpen=checked;
  if(!checked){
    item.status="";
  }
  save();
  render();
}
function toggle(i,v){state[active]=state[active]||{};state[active][i]=state[active][i]||{};state[active][i].status=v?'PASS':'';save();render()}
function setComment(i,v){state[active]=state[active]||{};state[active][i]=state[active][i]||{};state[active][i].comment=v;save()}
function addPhoto(i,file){if(!file)return;const reader=new FileReader();reader.onload=()=>{state[active]=state[active]||{};state[active][i]=state[active][i]||{};state[active][i].photo=reader.result;state[active][i].photoName=file.name;save();render()};reader.readAsDataURL(file)}
function saveNotes(){notes=document.getElementById("notes").value;localStorage.setItem("shiftNotes",notes);alert("Notes saved.")}
function completeShift(){
 let missing=[];
 Object.entries(data).forEach(([sec,arr])=>arr.forEach((x,i)=>{
   const st=state[sec]?.[i]||{};
   if(x.mandatory&&!st.status)missing.push(sec+": "+x.text);
   if(st.status==="FAIL"&&!st.comment?.trim())missing.push(sec+": "+x.text+" — FAIL comment required");
 }));
 if(missing.length){alert("Some required checks are incomplete:\n\n"+missing.slice(0,8).join("\n")+(missing.length>8?"\n...":""));return}
 alert("Shift completed. Handover notes have been saved.");localStorage.setItem("lastCompleted",new Date().toISOString());localStorage.setItem("lastSummary",getSummaryText());
}
function newShift(){if(confirm("Start a new shift? Current checklist ticks will be cleared.")){state={};notes="";document.getElementById("notes").value="";localStorage.removeItem("shiftNotes");save();render()}}
function clearCurrent(){if(confirm("Clear all checklist ticks for the current shift?")){state={};save();render()}}
function openManager(){renderManager();manager.showModal()}
function renderManager(){
manageList.innerHTML=Object.entries(data).map(([sec,arr])=>`<div class="card"><b>${sec}</b>${arr.map((x,i)=>`<div class="item"><div class="text">${esc(x.text)}<br><span class="small">${x.mandatory?'Required':'Optional'}</span></div><button class="secondary" onclick="editItem('${sec}',${i})">Edit</button><button class="secondary" onclick="moveItem('${sec}',${i},-1)">↑</button><button class="secondary" onclick="moveItem('${sec}',${i},1)">↓</button><button class="danger" onclick="deleteItem('${sec}',${i})">Delete</button></div>`).join("")}</div>`).join("");
}
function addItem(){let sec=prompt("Section (START SHIFT, DURING SHIFT, or END SHIFT):",active);if(!sec)return;sec=sec.toUpperCase();if(!data[sec]){alert("Use one of the existing sections.");return}let text=prompt("Checklist item:");if(!text)return;let mandatory=confirm("Make this item REQUIRED?");data[sec].push({text,mandatory});save();renderManager();render()}
function editItem(sec,i){let text=prompt("Edit checklist item:",data[sec][i].text);if(text===null)return;data[sec][i].text=text;data[sec][i].mandatory=confirm("Make this item REQUIRED?");save();renderManager();render()}
function deleteItem(sec,i){if(confirm("Delete this item?")){data[sec].splice(i,1);save();renderManager();render()}}
function moveItem(sec,i,dir){let j=i+dir;if(j<0||j>=data[sec].length)return;[data[sec][i],data[sec][j]]=[data[sec][j],data[sec][i]];save();renderManager();render()}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function getSummaryText(){
  const lines=[];
  lines.push("SHIFT HANDOVER / SUMMARY");
  lines.push(new Date().toLocaleString());
  lines.push("");
  let fail=0, incomplete=0, na=0, pass=0;
  Object.entries(data).forEach(([sec,arr])=>{
    lines.push(sec);
    arr.forEach((x,i)=>{
      const st=state[sec]?.[i]||{};
      if(st.status==="FAIL"){fail++; lines.push(`FAIL - ${x.text}${st.comment?" — "+st.comment:""}`)}
      else if(st.status==="N/A"){na++}
      else if(st.status==="PASS"){pass++}
      else if(x.mandatory){incomplete++; lines.push(`INCOMPLETE - ${x.text}`)}
    });
  });
  lines.push("");
  lines.push(`Status: ${pass} PASS | ${fail} FAIL | ${na} N/A | ${incomplete} INCOMPLETE`);
  if(notes.trim()){lines.push("");lines.push("SHIFT NOTES / HANDOVER");lines.push(notes.trim())}
  return lines.join("\n");
}
function showSummary(){
  const box=document.getElementById("summary"); box.classList.remove("hidden");
  const text=getSummaryText();
  box.innerHTML=`<textarea id="summaryText" rows="14" readonly>${esc(text)}</textarea>`;
}
function copySummary(){
  const text=getSummaryText();
  navigator.clipboard?.writeText(text).then(()=>alert("Shift summary copied."),()=>alert("Copy failed. Generate Summary and copy the text manually."));
}
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
